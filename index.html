<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maseer Media | AI Video Marketing</title>
    <meta name="description" content="Professional AI video marketing for Afghan brands">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6B21A8;
            --primary-dark: #581C87;
            --secondary: #EAB308;
            --dark: #0A0A0F;
            --dark-800: #1A1A2E;
            --success: #10B981;
            --error: #EF4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Naskh Arabic', sans-serif;
            background: var(--dark);
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        /* Simple gradient background (replaces consciousness.js) */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, var(--dark) 0%, #1a1030 50%, var(--dark) 100%);
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        header {
            text-align: center;
            padding: 2rem 0;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
        }
        
        .form-card {
            background: var(--dark-800);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-top: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
        }
        
        .required::after {
            content: " *";
            color: var(--error);
        }
        
        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.75rem;
            color: #fff;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .color-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .file-input {
            border: 2px dashed rgba(255,255,255,0.2);
            padding: 2rem;
            text-align: center;
            border-radius: 0.75rem;
            cursor: pointer;
        }
        
        .file-input:hover {
            border-color: var(--primary);
        }
        
        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid var(--error); color: #FCA5A5; }
        
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .submit-btn:hover:not(:disabled) { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            text-align: center;
            margin: 2rem 0;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 0.75rem;
        }
        
        .spec-value { font-size: 1.5rem; font-weight: 700; color: var(--secondary); }
        .spec-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); }
        
        @media (max-width: 600px) {
            .color-group { grid-template-columns: 1fr; }
            .specs { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="container">
        <header>
            <h1>Maseer Media</h1>
            <p class="subtitle">AI Video Marketing for Afghan Brands<br>4 Daily Campaigns • 1224×1536 • Meta-Optimized</p>
            
            <div class="specs">
                <div>
                    <div class="spec-value">1224</div>
                    <div class="spec-label">Width (px)</div>
                </div>
                <div>
                    <div class="spec-value">1536</div>
                    <div class="spec-label">Height (px)</div>
                </div>
                <div>
                    <div class="spec-value">4:5</div>
                    <div class="spec-label">Aspect Ratio</div>
                </div>
            </div>
        </header>
        
        <div class="form-card">
            <div class="alert alert-error" id="errorAlert"></div>
            
            <form id="registrationForm">
                <div class="form-group">
                    <label for="brandName" class="required">Brand Name (English)</label>
                    <input type="text" id="brandName" required placeholder="e.g., Zarrin Jewelry">
                </div>
                
                <div class="form-group">
                    <label for="localName">Brand Name (Dari/Pashto)</label>
                    <input type="text" id="localName" dir="rtl" placeholder="e.g., زرین جواهرات">
                </div>
                
                <div class="form-group">
                    <label for="industry" class="required">Industry</label>
                    <select id="industry" required>
                        <option value="">Select industry</option>
                        <option value="Jewelry & Gold">Jewelry & Gold</option>
                        <option value="Café & Restaurant">Café & Restaurant</option>
                        <option value="Fashion & Clothing">Fashion & Clothing</option>
                        <option value="Technology & IT">Technology & IT</option>
                        <option value="Healthcare & Medical">Healthcare & Medical</option>
                        <option value="Education & Training">Education & Training</option>
                        <option value="Real Estate">Real Estate</option>
                        <option value="Automotive">Automotive</option>
                        <option value="Beauty & Cosmetics">Beauty & Cosmetics</option>
                        <option value="Retail & Shopping">Retail & Shopping</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="required">Brand Colors</label>
                    <div class="color-group">
                        <input type="text" id="primaryColor" value="#6B21A8" placeholder="Primary #6B21A8">
                        <input type="text" id="secondaryColor" value="#EAB308" placeholder="Secondary #EAB308">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="logoInput">Logo (PNG/JPG, max 1.5MB)</label>
                    <div class="file-input" onclick="document.getElementById('logoInput').click()">
                        <div id="filePreview" style="display:none;"></div>
                        <div id="uploadText">Click to upload logo</div>
                    </div>
                    <input type="file" id="logoInput" accept="image/png,image/jpeg" style="display:none;">
                </div>
                
                <div class="form-group">
                    <label for="targetAudience">Target Audience</label>
                    <input type="text" id="targetAudience" placeholder="e.g., Women 25-45 in Kabul">
                </div>
                
                <div class="form-group">
                    <label for="keyOfferings">Key Products/Services</label>
                    <input type="text" id="keyOfferings" placeholder="What makes you special?">
                </div>
                
                <div class="form-group">
                    <label for="contact">WhatsApp Number</label>
                    <input type="tel" id="contact" placeholder="+93 70 123 4567">
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    Generate My Sample Video
                </button>
            </form>
        </div>
        
        <footer style="text-align: center; padding: 2rem; color: rgba(255,255,255,0.4); font-size: 0.875rem;">
            © 2026 Maseer Media • Kabul, Afghanistan
        </footer>
    </div>

    <!-- TOKEN INJECTION (Do not commit token to git - see instructions) -->

        window._SECURE_TOKEN = 'ghp_placeholder';
    </script>
    <script src="assets/js/app.js"></script>
</body>
</html>
