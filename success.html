<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - Maseer Media</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --maseer-purple: #6B21A8;
            --maseer-gold: #EAB308;
            --maseer-dark: #0A0A0F;
            --success: #10B981;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Noto Naskh Arabic', sans-serif;
            background: var(--maseer-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: 
                radial-gradient(ellipse at 20% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(107, 33, 168, 0.1) 0%, transparent 50%);
        }
        
        .success-card {
            background: linear-gradient(145deg, rgba(26, 26, 46, 0.95), rgba(18, 18, 26, 0.98));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 2rem;
            padding: 3.5rem;
            max-width: 700px;
            width: 100%;
            text-align: center;
            position: relative;
            animation: cardEntry 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .checkmark {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
            border: 3px solid var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3.5rem;
            animation: checkPulse 2s ease-in-out infinite;
        }
        
        @keyframes checkPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
        
        h1 {
            font-size: 2.25rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .brand-name {
            color: var(--maseer-gold);
            font-weight: 800;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1.125rem;
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }
        
        .progress-steps {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        
        .step.active {
            opacity: 1;
        }
        
        .step.completed {
            opacity: 1;
        }
        
        .step-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .step.completed .step-icon {
            background: var(--success);
            border-color: var(--success);
        }
        
        .step.active .step-icon {
            background: var(--maseer-purple);
            border-color: var(--maseer-gold);
            animation: stepPulse 2s infinite;
        }
        
        @keyframes stepPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.5); }
            50% { box-shadow: 0 0 0 15px rgba(107, 33, 168, 0); }
        }
        
        .specs-box {
            background: rgba(0,0,0,0.3);
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 2rem 0;
        }
        
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        
        .spec-item {
            text-align: center;
        }
        
        .spec-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--maseer-gold);
        }
        
        .spec-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.25rem;
        }
        
        .status-message {
            margin: 1.5rem 0;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 0.9375rem;
            display: none;
        }
        
        .status-message.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        .status-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: #6EE7B7;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--maseer-purple), #4C1D95);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(107, 33, 168, 0.4);
        }
        
        /* Language switcher */
        .lang-switcher {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.5rem;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            padding: 0.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .lang-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 0.75rem;
            transition: all 0.3s;
        }
        
        .lang-btn.active {
            background: linear-gradient(135deg, var(--maseer-purple), var(--maseer-gold));
            color: white;
        }
        
        [dir="rtl"] .lang-switcher {
            right: auto;
            left: 1.5rem;
        }
        
        @media (max-width: 640px) {
            .success-card {
                padding: 2rem;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            .specs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('fa')">دری</button>
        <button class="lang-btn" onclick="setLang('ps')">پښتو</button>
    </div>
    
    <div class="success-card">
        <div class="checkmark">✓</div>
        
        <h1 id="title">
            Welcome, <span class="brand-name" id="brandName">Your Brand</span>!
        </h1>
        
        <p class="subtitle" id="subtitle">
            Your registration is complete. We're generating your consciousness-optimized sample video.
        </p>
        
        <div class="progress-steps">
            <div class="step completed">
                <div class="step-icon">✓</div>
                <small id="step1">Registered</small>
            </div>
            <div class="step active">
                <div class="step-icon">⚡</div>
                <small id="step2">Creating</small>
            </div>
            <div class="step">
                <div class="step-icon">📤</div>
                <small id="step3">Delivering</small>
            </div>
        </div>
        
        <div class="specs-box">
            <div class="specs-grid">
                <div class="spec-item">
                    <div class="spec-value">1224</div>
                    <div class="spec-label" id="labelWidth">Width (px)</div>
                </div>
                <div class="spec-item">
                    <div class="spec-value">1536</div>
                    <div class="spec-label" id="labelHeight">Height (px)</div>
                </div>
                <div class="spec-item">
                    <div class="spec-value">4:5</div>
                    <div class="spec-label" id="labelRatio">Aspect</div>
                </div>
            </div>
        </div>
        
        <div class="status-message status-success" id="statusMsg"></div>
        
        <a href="index.html" class="btn" id="btnAnother">Register Another Brand →</a>
    </div>

    <script>
        const translations = {
            en: {
                title: 'Welcome, {brand}!',
                subtitle: 'Your registration is complete. We\'re generating your consciousness-optimized sample video.',
                step1: 'Registered',
                step2: 'Creating',
                step3: 'Delivering',
                labelWidth: 'Width (px)',
                labelHeight: 'Height (px)',
                labelRatio: 'Aspect',
                btnAnother: 'Register Another Brand →',
                successMsg: 'Issue #{issue} created! Check your Telegram in 2-3 minutes.'
            },
            fa: {
                title: 'خوش آمدید، {brand}!',
                subtitle: 'ثبت‌نام شما تکمیل شد. ما در حال ساخت نمونه بهینه‌شده برای هوشیاری شما هستیم.',
                step1: 'ثبت شد',
                step2: 'در حال ساخت',
                step3: 'در حال تحویل',
                labelWidth: 'عرض (پیکسل)',
                labelHeight: 'ارتفاع (پیکسل)',
                labelRatio: 'نسبت',
                btnAnother: 'برند دیگری ثبت کنید →',
                successMsg: 'شماره #{issue} ایجاد شد! تلگرام خود را در ۲-۳ دقیقه دیگر چک کنید.'
            },
            ps: {
                title: 'ښه راغلاست، {brand}!',
                subtitle: 'ستاسو ثبت نام بشپړ شو. موږ ستاسو د هوښیارۍ لپاره بهینه شوی نمونه جوړوو.',
                step1: 'ثبت شو',
                step2: 'جوړیږي',
                step3: 'تحویل کیږي',
                labelWidth: 'پلنوالی (پیکسل)',
                labelHeight: 'لوړوالی (پیکسل)',
                labelRatio: 'نسبت',
                btnAnother: 'بل برند ثبت کړئ →',
                successMsg: 'شمیره #{issue} جوړه شوه! خپل Telegram په ۲-۳ دقیقو کې وګورئ.'
            }
        };
        
        let currentLang = 'en';
        let formData = null;
        
        function setLang(lang) {
            currentLang = lang;
            document.documentElement.dir = (lang === 'fa' || lang === 'ps') ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase().includes(lang));
            });
            
            updateContent();
        }
        
        function updateContent() {
            const t = translations[currentLang];
            const brand = formData?.brand_name || 'Your Brand';
            
            document.getElementById('title').innerHTML = t.title.replace('{brand}', `<span class="brand-name">${brand}</span>`);
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('step1').textContent = t.step1;
            document.getElementById('step2').textContent = t.step2;
            document.getElementById('step3').textContent = t.step3;
            document.getElementById('labelWidth').textContent = t.labelWidth;
            document.getElementById('labelHeight').textContent = t.labelHeight;
            document.getElementById('labelRatio').textContent = t.labelRatio;
            document.getElementById('btnAnother').textContent = t.btnAnother;
        }
        
        // Initialize
        formData = JSON.parse(sessionStorage.getItem('maseer_registration') || '{}');
        document.getElementById('brandName').textContent = formData.brand_name || 'Your Brand';
        
        // Detect language
        const saved = localStorage.getItem('maseer_lang');
        if (saved) setLang(saved);
        
        // Simulate GitHub issue creation
        setTimeout(() => {
            const issueNum = Math.floor(Math.random() * 1000) + 1;
            const t = translations[currentLang];
            const msg = document.getElementById('statusMsg');
            msg.textContent = t.successMsg.replace('{issue}', issueNum);
            msg.classList.add('show');
            
            // Update step
            document.querySelector('.step.active').classList.remove('active');
            document.querySelector('.step:last-child').classList.add('active');
        }, 2000);
        
        updateContent();
    </script>
</body>
</html>
