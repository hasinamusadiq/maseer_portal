name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Inject Firebase Configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          CLOUD_FUNCTION_URL: ${{ secrets.CLOUD_FUNCTION_URL }}
          SMS_NUMBER: ${{ secrets.SMS_NUMBER }}
          BACKEND_REPO: ${{ secrets.BACKEND_REPO }}
        run: |
          # Replace placeholders in config.js with actual values
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" assets/js/config.js
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${FIREBASE_AUTH_DOMAIN}|g" assets/js/config.js
          sed -i "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g" assets/js/config.js
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g" assets/js/config.js
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" assets/js/config.js
          sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g" assets/js/config.js
          sed -i "s|__CLOUD_FUNCTION_URL__|${CLOUD_FUNCTION_URL}|g" assets/js/config.js
          sed -i "s|__SMS_NUMBER__|${SMS_NUMBER}|g" assets/js/config.js
          sed -i "s|__BACKEND_REPO__|${BACKEND_REPO}|g" assets/js/config.js
          
          echo "✅ Configuration injected successfully"
          
          # Verify replacements (mask secrets in logs)
          grep -o "apiKey:.*" assets/js/config.js | sed 's/[^:]*:.\{5\}/apiKey: ***/'
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
